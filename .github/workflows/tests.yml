name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # gsuite borrows classroom's Chrome profile, CDP driver and identity
      # guard rather than duplicating them, so the sibling has to be present.
      - name: Install classroom-cli
        run: |
          git clone --depth 1 https://github.com/CloudCompile/classroom-cli "$RUNNER_TEMP/classroom"
          pip install -e "$RUNNER_TEMP/classroom"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: python -m pytest
